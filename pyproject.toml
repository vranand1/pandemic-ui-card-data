[project]
name = "pandemic-ui-card-data"
version = "1.1.0"
description = "Can public card data see the spending drop from ending pandemic unemployment benefits early?"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "statsmodels>=0.14", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
